<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="星图——一生切成若干星座，每段人生一座，每条记忆一颗星。连线即时间。"
    />
    <meta name="theme-color" content="#000000" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M8 21L24 11' stroke='%239fc4ff' stroke-opacity='.5' stroke-width='1'/%3E%3Ccircle cx='8' cy='21' r='2' fill='%23fafafa'/%3E%3Ccircle cx='24' cy='11' r='3' fill='%23fafafa'/%3E%3C/svg%3E"
    />
    <title>星图 · The Starmap</title>
  </head>
  <body>
    <a class="skip-link" href="#chart">跳过星图，直达记忆</a>

    <canvas id="sky" aria-hidden="true"></canvas>
    <div id="ambient" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>
    <button id="drag" aria-label="拖动或用方向键旋转星图"></button>

    <a class="theme-link theme-link-1" href="./index.html">深渊 →</a>
    <a class="theme-link theme-link-2" href="./journey.html">旅路 →</a>
    <a class="theme-link theme-link-3" href="./profile.html">炽热 →</a>
    <a class="theme-link theme-link-4" href="./piano.html">琴 →</a>

    <header class="hero">
      <h1 class="pin pin-left" id="pin-name"></h1>
      <p class="pin pin-right" id="pin-theme" aria-hidden="true"></p>
      <p class="visually-hidden">
        星图：一生切成若干星座，每段人生一座，每条记忆一颗星，连线即时间。
      </p>
      <p class="scroll-hint" aria-hidden="true">Scroll</p>
    </header>

    <main id="chart"></main>

    <button id="replay" title="重播成形" aria-label="重播当前星座的成形动画">
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M3 12a9 9 0 1 0 3-6.7" />
        <path d="M3 4v5h5" />
      </svg>
    </button>

    <script type="module" src="/src/starmap/main.ts"></script>
  </body>
</html>
