<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个平凡却认真的人——Lee 的自述、作品与里程碑。" />
    <meta name="theme-color" content="#050608" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050608'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23e8b86a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23539dfd'/%3E%3C/svg%3E"
    />
    <title>炽热 · Lee</title>
  </head>
  <body>
    <a class="skip-link" href="#milestones">跳到里程碑</a>
    <a class="theme-link" href="./index.html">深渊 →</a>
    <a class="theme-link theme-link-2" href="./journey.html">旅路 →</a>
    <a class="theme-link theme-link-3" href="./piano.html">琴 →</a>

    <main>
      <!-- 1 · HERO ------------------------------------------------ -->
      <section class="s-hero" id="hero" aria-label="自我介绍">
        <div class="hero-bg" aria-hidden="true"></div>
        <div class="hero-veil" aria-hidden="true"></div>

        <div class="hero-copy">
          <p class="eyebrow" data-anim></p>
          <h1 class="hero-title">
            <span class="hero-hello" data-anim>👋 <em></em></span>
            <span class="hero-lead" data-anim></span>
            <span class="hero-name" data-anim></span>
          </h1>
          <p class="hero-intro" data-anim></p>
          <p class="hero-lede" data-anim></p>
          <div class="hero-links" data-anim></div>
        </div>

        <ul class="hero-bubbles" aria-hidden="true"></ul>
        <ul class="hero-stats"></ul>
      </section>

      <!-- 2 · PLACE ----------------------------------------------- -->
      <section class="s-place" id="place" aria-label="所在地">
        <div class="place-bg" aria-hidden="true"></div>
        <p class="place-watermark" aria-hidden="true"></p>
        <div class="place-pin" aria-hidden="true">
          <span class="pin-dot"></span>
          <span class="pin-label"></span>
        </div>
        <h2 class="place-title"></h2>
        <div class="place-hud" aria-hidden="true">
          <span><i>LAT</i> <b class="lat"></b></span>
          <span><i>LNG</i> <b class="lng"></b></span>
          <span class="place-meta"></span>
        </div>
      </section>

      <!-- 3 · CREED（四页 pin） ------------------------------------ -->
      <section class="s-creed" id="creed" aria-label="四条自述">
        <div class="creed-stage">
          <div class="creed-glow" aria-hidden="true"></div>
          <div class="creed-marks" aria-hidden="true"></div>
          <div class="creed-pages"></div>
          <div class="creed-progress" aria-hidden="true">
            <span class="dots"></span>
            <span class="creed-caption"></span>
          </div>
        </div>
      </section>

      <!-- 4 · FREEDOM --------------------------------------------- -->
      <section class="s-freedom" id="freedom" aria-label="自由">
        <div class="freedom-bg" aria-hidden="true"></div>
        <p class="freedom-watermark" aria-hidden="true"></p>
        <div class="freedom-copy">
          <h2 class="freedom-title"></h2>
          <p class="freedom-lede"></p>
        </div>
        <div class="marquee freedom-places" aria-hidden="true"><div class="marquee-track"></div></div>
      </section>

      <!-- 5 · PHOTOS ---------------------------------------------- -->
      <section class="s-photos" id="photos" aria-label="照片墙">
        <div class="photo-wall" aria-hidden="true"></div>
        <div class="photo-foot">
          <span class="photo-caption"></span>
          <a class="photo-action" href="#"></a>
        </div>
      </section>

      <!-- 6 · IDENTITY -------------------------------------------- -->
      <section class="s-identity" id="identity" aria-label="另一个身份">
        <div class="identity-bg" aria-hidden="true"></div>
        <h2 class="identity-title"></h2>
        <p class="identity-sub"></p>
      </section>

      <!-- 7 · WORKS ----------------------------------------------- -->
      <section class="s-works" id="works" aria-label="作品">
        <p class="works-watermark" aria-hidden="true"></p>
        <h2 class="works-title"></h2>
        <p class="works-lede"></p>
        <div class="works-wall"></div>
      </section>

      <!-- 8 · STACK ----------------------------------------------- -->
      <section class="s-stack" id="stack" aria-label="此站构造">
        <div class="stack-grid"></div>
      </section>

      <!-- 9 · VOICES ---------------------------------------------- -->
      <section class="s-voices" id="voices" aria-label="语录墙">
        <div class="voices-rows" aria-hidden="true"></div>
        <h2 class="voices-title"></h2>
      </section>

      <!-- 10 · SUMMIT --------------------------------------------- -->
      <section class="s-summit" id="summit" aria-label="山顶">
        <div class="summit-bg" aria-hidden="true"></div>
        <div class="summit-copy">
          <p class="summit-lead"></p>
          <p class="summit-big"></p>
          <p class="summit-tail"></p>
        </div>
      </section>

      <!-- 11 · MILESTONES ----------------------------------------- -->
      <section class="s-milestones" id="milestones" aria-label="里程碑">
        <div class="ms-stage">
          <h2 class="ms-title"><span class="ms-trophy" aria-hidden="true">🏆</span><span></span></h2>
          <div class="ms-track">
            <svg class="ms-curve" aria-hidden="true" preserveAspectRatio="none"><path /></svg>
            <div class="ms-items"></div>
          </div>
          <p class="ms-hint" aria-hidden="true"></p>
        </div>
      </section>
    </main>

    <noscript>
      <p class="noscript">这一页需要 JavaScript 才能滚动叙事。内容目录：自述 / 所在地 / 四条自述 / 自由 / 照片 / 身份 / 作品 / 构造 / 语录 / 山顶 / 里程碑。</p>
    </noscript>

    <script type="module" src="/src/profile/main.ts"></script>
  </body>
</html>
